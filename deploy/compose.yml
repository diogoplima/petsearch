services:
  db:
    build: ./db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: petsearch
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../api
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  caddy:
    image: caddy:2-alpine
    volumes:
      - caddy-data:/data
      - web-build:/srv/web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api

  minio:
    image: minio/minio:latest
    profiles: ["standins"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["standins"]
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db-data:
  caddy-data:
  web-build:
  minio-data:
